{
  "openapi": "3.1.0",
  "info": {
    "title": "BirdBox Local API",
    "version": "1.0.0",
    "description": "Authoritative birdbox-v1@1.0.0 contract for birdpart2. New success responses use a data envelope. Errors use top-level error_code and error_message."
  },
  "servers": [
    {
      "url": "http://{boxHost}/api/v1",
      "variables": {
        "boxHost": {
          "default": "192.168.4.1:8080"
        }
      }
    }
  ],
  "security": [
    {
      "BearerAuth": []
    }
  ],
  "paths": {
    "/device/status": {
      "parameters": [
        {
          "$ref": "#/components/parameters/ApiVersion"
        }
      ],
      "get": {
        "operationId": "getDeviceStatus",
        "summary": "Read the complete device status",
        "security": [],
        "responses": {
          "200": {
            "$ref": "#/components/responses/DeviceStatusResponse"
          },
          "400": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/device/pair": {
      "parameters": [
        {
          "$ref": "#/components/parameters/ApiVersion"
        }
      ],
      "post": {
        "operationId": "pairDevice",
        "summary": "Exchange a pairing code for a device-scoped access token",
        "security": [],
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "pairing_code",
                  "client_name"
                ],
                "properties": {
                  "pairing_code": {
                    "type": "string",
                    "minLength": 4
                  },
                  "client_name": {
                    "type": "string",
                    "minLength": 1
                  }
                },
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "$ref": "#/components/responses/PairResponse"
          },
          "400": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "403": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/events": {
      "parameters": [
        {
          "$ref": "#/components/parameters/ApiVersion"
        }
      ],
      "get": {
        "operationId": "openEventStream",
        "summary": "Upgrade to the authenticated v1 WebSocket event stream",
        "description": "Every v1 message contains a complete DeviceStatus or BirdJobStatus payload. Incremental payloads and required sequence numbers are reserved for v2.",
        "x-websocket-message-schema": {
          "$ref": "./schemas/event-envelope.schema.json"
        },
        "responses": {
          "101": {
            "description": "Switching Protocols"
          },
          "401": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "403": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/storage/cards/current/scan": {
      "parameters": [
        {
          "$ref": "#/components/parameters/ApiVersion"
        }
      ],
      "get": {
        "operationId": "getCurrentCardScan",
        "summary": "Read the latest scan for the current storage card",
        "responses": {
          "200": {
            "$ref": "#/components/responses/CardScanResponse"
          },
          "401": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/storage/cards/current/rescan": {
      "parameters": [
        {
          "$ref": "#/components/parameters/ApiVersion"
        }
      ],
      "post": {
        "operationId": "rescanCurrentCard",
        "summary": "Start or replay an idempotent card scan",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "responses": {
          "202": {
            "$ref": "#/components/responses/JobResponse"
          },
          "401": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "422": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/projects": {
      "parameters": [
        {
          "$ref": "#/components/parameters/ApiVersion"
        }
      ],
      "get": {
        "operationId": "listProjects",
        "summary": "List projects",
        "parameters": [
          {
            "$ref": "#/components/parameters/Cursor"
          },
          {
            "$ref": "#/components/parameters/PageSize"
          },
          {
            "name": "state",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "sort",
            "in": "query",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/ProjectListResponse"
          },
          "401": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      },
      "post": {
        "operationId": "createProject",
        "summary": "Create a real project from the current card",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "name",
                  "card_id"
                ],
                "properties": {
                  "name": {
                    "type": "string",
                    "minLength": 1
                  },
                  "card_id": {
                    "type": "string",
                    "minLength": 1
                  }
                },
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "201": {
            "$ref": "#/components/responses/ProjectResponse"
          },
          "401": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "409": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "422": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/projects/current": {
      "parameters": [
        {
          "$ref": "#/components/parameters/ApiVersion"
        }
      ],
      "get": {
        "operationId": "getCurrentProject",
        "summary": "Read the current project; data is null when none exists",
        "responses": {
          "200": {
            "description": "Current project or null",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "oneOf": [
                        {
                          "$ref": "./schemas/project.schema.json"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "additionalProperties": false
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/projects/{projectId}/resume": {
      "parameters": [
        {
          "$ref": "#/components/parameters/ApiVersion"
        },
        {
          "$ref": "#/components/parameters/ProjectId"
        }
      ],
      "post": {
        "operationId": "resumeProject",
        "summary": "Resume an incomplete project",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/ProjectResponse"
          },
          "404": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "409": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/projects/{projectId}/imports": {
      "parameters": [
        {
          "$ref": "#/components/parameters/ApiVersion"
        },
        {
          "$ref": "#/components/parameters/ProjectId"
        }
      ],
      "post": {
        "operationId": "createImportJob",
        "summary": "Create an import/index job",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "source",
                  "read_only",
                  "generate_thumbnails",
                  "generate_previews"
                ],
                "properties": {
                  "source": {
                    "const": "card"
                  },
                  "read_only": {
                    "const": true
                  },
                  "generate_thumbnails": {
                    "type": "boolean"
                  },
                  "generate_previews": {
                    "type": "boolean"
                  }
                },
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "202": {
            "$ref": "#/components/responses/JobResponse"
          },
          "409": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "422": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/projects/{projectId}/analysis-jobs": {
      "parameters": [
        {
          "$ref": "#/components/parameters/ApiVersion"
        },
        {
          "$ref": "#/components/parameters/ProjectId"
        }
      ],
      "post": {
        "operationId": "createAnalysisJob",
        "summary": "Create an AI analysis job",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "mode",
                  "include_grouping"
                ],
                "properties": {
                  "mode": {
                    "type": "string",
                    "enum": [
                      "standard"
                    ]
                  },
                  "include_grouping": {
                    "type": "boolean"
                  }
                },
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "202": {
            "$ref": "#/components/responses/JobResponse"
          },
          "409": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "422": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/projects/{projectId}/files": {
      "parameters": [
        {
          "$ref": "#/components/parameters/ApiVersion"
        },
        {
          "$ref": "#/components/parameters/ProjectId"
        }
      ],
      "get": {
        "operationId": "listPhotos",
        "summary": "List photos in a project",
        "parameters": [
          {
            "$ref": "#/components/parameters/Cursor"
          },
          {
            "$ref": "#/components/parameters/PageSize"
          },
          {
            "name": "sort",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "keep_state",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "analysis_state",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "group_id",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "scene_id",
            "in": "query",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/PhotoListResponse"
          },
          "404": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/projects/{projectId}/files/actions": {
      "parameters": [
        {
          "$ref": "#/components/parameters/ApiVersion"
        },
        {
          "$ref": "#/components/parameters/ProjectId"
        }
      ],
      "post": {
        "operationId": "applyPhotoBatchAction",
        "summary": "Apply an idempotent batch photo operation",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "file_ids",
                  "operation",
                  "version"
                ],
                "properties": {
                  "file_ids": {
                    "type": "array",
                    "minItems": 1,
                    "uniqueItems": true,
                    "items": {
                      "type": "string"
                    }
                  },
                  "operation": {
                    "type": "string",
                    "enum": [
                      "pending",
                      "keep",
                      "discard",
                      "featured",
                      "add_tags",
                      "remove_tags"
                    ]
                  },
                  "value": {},
                  "version": {
                    "type": "integer",
                    "minimum": 0
                  }
                },
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "$ref": "#/components/responses/GenericDataResponse"
          },
          "409": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "422": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/projects/{projectId}/groups": {
      "parameters": [
