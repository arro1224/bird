name: aves
description: Bird Companion mobile client for connecting to and managing the bird photography box.
publish_to: none
version: 1.14.8+172

environment:
  flutter: 3.44.5
  sdk: ">=3.12.0 <4.0.0"

platforms:
  android:

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  connectivity_plus:
  dio: ^5.8.0+1
  equatable:
  flutter_bloc: ^9.1.1
  flutter_cache_manager:
  hive_flutter: ^1.1.0
  mobile_scanner: ^7.0.0
  multicast_dns: ^0.3.2+7
  package_info_plus:
  path_provider: ^2.1.5
  permission_handler:
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:

flutter:
  assets:
    - assets/bird_companion/connection/
  uses-material-design: true
